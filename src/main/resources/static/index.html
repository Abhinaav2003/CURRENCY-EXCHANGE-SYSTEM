<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Currency Converter</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#14182b;--muted:#6b7190;--line:#e3e6f2;--accent:#5b5bf0;--accent2:#8a5cf6;--hover:#eef0ff;--shadow:0 20px 50px rgba(40,50,120,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1020;--card:#171b31;--text:#eef0ff;--muted:#9097bd;--line:#272c4a;--hover:#222850;--shadow:0 20px 50px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#0d1020;--card:#171b31;--text:#eef0ff;--muted:#9097bd;--line:#272c4a;--hover:#222850;--shadow:0 20px 50px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:24px 16px 0;
background-image:radial-gradient(700px 300px at 50% -50px,rgba(110,90,250,.22),transparent)}
main{width:100%;max-width:480px;flex:1}
h1{font-size:26px;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
label.l{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.row{display:flex;gap:10px;margin:8px 0 14px}
input.amt{flex:1;min-width:0;font-size:30px;font-weight:700;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:14px;padding:10px 14px;outline:none}
input.amt:focus,.sel-btn:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,91,240,.2)}
.pick{position:relative;flex:1.1;min-width:0}
.sel-btn{width:100%;height:100%;min-height:52px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:14px;padding:8px 12px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
.sel-btn .fl{font-size:22px}.sel-btn .car{margin-left:auto;color:var(--muted);font-size:12px}
.pop{position:absolute;z-index:20;top:calc(100% + 6px);left:0;right:0;min-width:260px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);display:none;overflow:hidden}
.pick.open .pop{display:block}
.pop input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--text);padding:12px 14px;font:inherit;outline:none}
.list{max-height:240px;overflow-y:auto;margin:0;padding:6px;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;font-size:14px}
.list li:hover,.list li.act{background:var(--hover)}
.list li small{color:var(--muted);margin-left:auto}
.list .none{color:var(--muted);cursor:default;justify-content:center}
.swap{display:flex;justify-content:center;margin:-4px 0}
.swap button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--accent);font-size:18px;cursor:pointer;transition:transform .3s}
.swap button:hover{transform:rotate(180deg)}
.result{margin-top:16px;padding:18px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.result .big{font-size:32px;font-weight:800;letter-spacing:-.02em;word-break:break-word}
.result .small{opacity:.85;font-size:13px;margin-top:4px}
.quick{margin-top:18px}
.quick h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip:hover{background:var(--hover)}
.note{color:var(--muted);font-size:12px;margin:14px 4px 0;text-align:center}
.theme{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;width:40px;height:40px;cursor:pointer}
footer{width:100%;text-align:center;padding:26px 0 calc(22px + env(safe-area-inset-bottom,0px));color:var(--muted);font-size:14px}
footer b{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<button class="theme" id="theme" aria-label="Toggle theme">◐</button>
<main>
  <h1>Currency Converter</h1>
  <p class="sub">Convert between 40+ world currencies instantly.</p>
  <div class="card">
    <label class="l" for="amt">Amount</label>
    <div class="row">
      <input class="amt" id="amt" type="number" inputmode="decimal" value="100" min="0">
      <div class="pick" id="fromPick"></div>
    </div>
    <div class="swap"><button id="swap" aria-label="Swap currencies">⇅</button></div>
    <label class="l">Converted to</label>
    <div class="row"><div class="pick" id="toPick" style="flex:1"></div></div>
    <div class="result">
      <div class="big" id="out">—</div>
      <div class="small" id="rate"></div>
    </div>
  </div>
  <div class="quick">
    <h2>Popular pairs</h2>
    <div class="chips" id="chips"></div>
  </div>
  <p class="note">Rates are an indicative snapshot, not live market rates.</p>
</main>
<footer>Made by <b>Abhinav Tiwari</b></footer>

<script>
const C=[["USD","US Dollar","🇺🇸",1],["EUR","Euro","🇪🇺",0.92],["GBP","British Pound","🇬🇧",0.78],["INR","Indian Rupee","🇮🇳",88.2],["JPY","Japanese Yen","🇯🇵",151],["AUD","Australian Dollar","🇦🇺",1.53],["CAD","Canadian Dollar","🇨🇦",1.38],["CHF","Swiss Franc","🇨🇭",0.88],["CNY","Chinese Yuan","🇨🇳",7.2],["HKD","Hong Kong Dollar","🇭🇰",7.8],["SGD","Singapore Dollar","🇸🇬",1.34],["NZD","New Zealand Dollar","🇳🇿",1.66],["AED","UAE Dirham","🇦🇪",3.67],["SAR","Saudi Riyal","🇸🇦",3.75],["QAR","Qatari Riyal","🇶🇦",3.64],["KWD","Kuwaiti Dinar","🇰🇼",0.31],["BHD","Bahraini Dinar","🇧🇭",0.376],["OMR","Omani Rial","🇴🇲",0.385],["PKR","Pakistani Rupee","🇵🇰",280],["BDT","Bangladeshi Taka","🇧🇩",120],["LKR","Sri Lankan Rupee","🇱🇰",300],["NPR","Nepalese Rupee","🇳🇵",141],["THB","Thai Baht","🇹🇭",35],["MYR","Malaysian Ringgit","🇲🇾",4.4],["IDR","Indonesian Rupiah","🇮🇩",16000],["PHP","Philippine Peso","🇵🇭",58],["VND","Vietnamese Dong","🇻🇳",25300],["KRW","South Korean Won","🇰🇷",1380],["TWD","New Taiwan Dollar","🇹🇼",32],["RUB","Russian Ruble","🇷🇺",92],["TRY","Turkish Lira","🇹🇷",41],["SEK","Swedish Krona","🇸🇪",10.6],["NOK","Norwegian Krone","🇳🇴",10.9],["DKK","Danish Krone","🇩🇰",6.9],["PLN","Polish Zloty","🇵🇱",3.9],["CZK","Czech Koruna","🇨🇿",22.5],["ZAR","South African Rand","🇿🇦",17.8],["NGN","Nigerian Naira","🇳🇬",1550],["EGP","Egyptian Pound","🇪🇬",49],["KES","Kenyan Shilling","🇰🇪",129],["BRL","Brazilian Real","🇧🇷",5.5],["MXN","Mexican Peso","🇲🇽",19.5],["ARS","Argentine Peso","🇦🇷",1000],["ILS","Israeli Shekel","🇮🇱",3.7]];
const M=Object.fromEntries(C.map(c=>[c[0],c]));
const st={from:"USD",to:"INR"};
const $=id=>document.getElementById(id);
function fmt(n,code){const d=["JPY","KRW","VND","IDR"].includes(code)?0:2;return n.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d<2?0:(n<1?4:2)})}
function convert(){
  const a=parseFloat($("amt").value);
  const r=M[st.to][3]/M[st.from][3];
  $("out").textContent=isNaN(a)?"—":fmt(a*r,st.to)+" "+st.to;
  $("rate").textContent="1 "+st.from+" = "+r.toLocaleString(undefined,{maximumFractionDigits:4})+" "+st.to;
}
function picker(host,key){
  host.innerHTML='<button class="sel-btn" type="button"><span class="fl"></span><span class="nm"></span><span class="car">▾</span></button><div class="pop"><input type="text" placeholder="Search currency or country…" aria-label="Search currency"><ul class="list"></ul></div>';
  const btn=host.querySelector(".sel-btn"),inp=host.querySelector("input"),ul=host.querySelector("ul");
  let act=0,items=[];
  function label(){const c=M[st[key]];btn.querySelector(".fl").textContent=c[2];btn.querySelector(".nm").textContent=c[0]}
  function render(){
    const q=inp.value.trim().toLowerCase();
    items=C.filter(c=>!q||c[0].toLowerCase().includes(q)||c[1].toLowerCase().includes(q));
    act=Math.min(act,Math.max(items.length-1,0));
    ul.innerHTML=items.length?items.map((c,i)=>'<li data-c="'+c[0]+'" class="'+(i===act?"act":"")+'"><span>'+c[2]+'</span><span><b>'+c[0]+'</b> '+c[1]+'</span></li>').join(""):'<li class="none">No currency found</li>';
  }
  function choose(code){st[key]=code;close();sync()}
  function open(){document.querySelectorAll(".pick.open").forEach(p=>p.classList.remove("open"));host.classList.add("open");inp.value="";act=0;render();inp.focus()}
  function close(){host.classList.remove("open")}
  btn.onclick=()=>host.classList.contains("open")?close():open();
  inp.oninput=()=>{act=0;render()};
  inp.onkeydown=e=>{
    if(e.key==="ArrowDown"){act=Math.min(act+1,items.length-1);render();e.preventDefault()}
    else if(e.key==="ArrowUp"){act=Math.max(act-1,0);render();e.preventDefault()}
    else if(e.key==="Enter"&&items[act]){choose(items[act][0])}
    else if(e.key==="Escape"){close();btn.focus()}
  };
  ul.onclick=e=>{const li=e.target.closest("li[data-c]");if(li)choose(li.dataset.c)};
  host.update=label;label();
}
const pf=$("fromPick"),pt=$("toPick");picker(pf,"from");picker(pt,"to");
function sync(){pf.update();pt.update();convert()}
document.addEventListener("click",e=>{if(!e.target.closest(".pick"))document.querySelectorAll(".pick.open").forEach(p=>p.classList.remove("open"))});
$("amt").oninput=convert;
$("swap").onclick=()=>{[st.from,st.to]=[st.to,st.from];sync()};
[["USD","INR"],["EUR","USD"],["GBP","INR"],["AED","INR"],["USD","JPY"],["EUR","GBP"]].forEach(([f,t])=>{
  const b=document.createElement("button");b.className="chip";b.textContent=M[f][2]+" "+f+" → "+M[t][2]+" "+t;
  b.onclick=()=>{st.from=f;st.to=t;sync()};$("chips").appendChild(b)});
$("theme").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
convert();
</script>
</body>
</html>
