server.port=${PORT:8080}
spring.application.name=currency-exchange

# --- Database ---
# Neon: set DB_URL, DB_USER, DB_PASSWORD (see README). If DB_URL is not set,
# the app falls back to in-memory H2 so it still runs locally.
spring.datasource.url=${DB_URL:jdbc:h2:mem:currency;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

# Neon suspends idle compute, so keep the pool small, recycle connections,
# and allow time for a cold start.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000

# Free, no-key API that updates once per day
rates.api-url=https://open.er-api.com/v6/latest/USD
# Every day at 00:30 UTC
rates.cron=0 30 0 * * *
